<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나무의사 합격노트 🌳</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="app-shell">
<aside class="sidebar">
  <div class="sidebar-brand"><span class="logo">🌳</span><span class="name">나무의사<br>합격노트</span></div>
  <a class="sidebar-back" href="../index.html">← 전체 허브로</a>
  <nav>
    <button data-page="home" class="active">🏠 홈</button>
    <button data-page="theory">📖 이론</button>
    <button data-page="flashcard">🎴 암기카드</button>
    <button data-page="quiz">📝 문제풀이</button>
    <button data-page="wrong">❌ 오답노트</button>
  </nav>
</aside>
<div class="main-content">
<main>

  <!-- ══ 홈 ══ -->
  <div id="page-home" class="page active">
    <div class="page-title-row">
      <h2>나무의사 합격노트</h2>
      <p>초급 → 중급 → 고급 단계를 차근차근 밟아가며 합격을 준비하세요!</p>
    </div>

    <div class="stat-row" id="stat-row"></div>

    <div id="review-widget"></div>

    <div class="section-title">📚 단계별 학습 경로</div>
    <div id="stages-grid"></div>
  </div>

  <!-- ══ 이론 ══ -->
  <div id="page-theory" class="page">
    <div id="theory-list-view">
      <div class="section-title">📖 이론 정리</div>
      <div class="filter-bar" id="theory-filter-bar"></div>
      <div class="theory-list" id="theory-list"></div>
    </div>
    <div id="theory-detail-view" style="display:none"></div>
  </div>

  <!-- ══ 암기카드 ══ -->
  <div id="page-flashcard" class="page">
    <div class="section-title">🎴 암기 카드</div>
    <p style="font-size:12px;color:var(--text-light);margin-bottom:14px">카드를 탭하면 두문자·연상 암기법이 나와요. 넘기면서 빠르게 훑어보세요!</p>
    <div class="filter-bar" id="flashcard-filter-bar"></div>
    <div id="flashcard-area"></div>
  </div>

  <!-- ══ 문제풀이 ══ -->
  <div id="page-quiz" class="page">

    <div id="quiz-setup">
      <div class="section-title">📝 난이도 선택</div>
      <div class="quiz-level-tabs">
        <div class="quiz-level-tab sel-초급" data-level="초급" onclick="selectQuizLevel('초급')">
          <span class="tab-icon">🌱</span>초급
          <span class="tab-count">0문제</span>
        </div>
        <div class="quiz-level-tab" data-level="중급" onclick="selectQuizLevel('중급')">
          <span class="tab-icon">🌿</span>중급
          <span class="tab-count">0문제</span>
        </div>
        <div class="quiz-level-tab" data-level="고급" onclick="selectQuizLevel('고급')">
          <span class="tab-icon">🌳</span>고급
          <span class="tab-count">0문제</span>
        </div>
        <div class="quiz-level-tab" data-level="전체" onclick="selectQuizLevel('전체')">
          <span class="tab-icon">📚</span>전체
          <span class="tab-count">0문제</span>
        </div>
      </div>

      <div class="section-title">⚡ 풀이 방식</div>
      <div class="quiz-mode-grid">
        <div class="quiz-mode-btn" onclick="selectQuizMode('random', this)">
          <span class="mode-icon">🎲</span>
          <div class="mode-title">랜덤 10문제</div>
          <div class="mode-desc">무작위 출제</div>
        </div>
        <div class="quiz-mode-btn" onclick="selectQuizMode('all', this)">
          <span class="mode-icon">📚</span>
          <div class="mode-title">전체 풀기</div>
          <div class="mode-desc">선택 레벨 전체</div>
        </div>
        <div class="quiz-mode-btn" onclick="selectQuizMode('wrong', this)">
          <span class="mode-icon">❌</span>
          <div class="mode-title">오답만</div>
          <div class="mode-desc">틀린 문제 복습</div>
        </div>
      </div>

      <button id="start-quiz-btn" class="start-quiz-btn" onclick="startQuiz()" disabled>
        문제풀이 시작 →
      </button>
    </div>

    <!-- 문제 풀기 화면 -->
    <div id="quiz-player" class="quiz-player">
      <div class="quiz-progress-bar">
        <div class="quiz-progress-fill" id="quiz-progress-fill" style="width:0%"></div>
      </div>
      <div style="background:var(--white);border-radius:var(--radius);padding:22px;box-shadow:var(--shadow)">
        <div class="quiz-meta">
          <div style="display:flex;gap:8px;align-items:center">
            <span class="quiz-subject-tag" id="quiz-subject-tag"></span>
            <span id="quiz-level-tag" class="quiz-level-tag-small"></span>
          </div>
          <span class="quiz-num" id="quiz-num"></span>
        </div>
        <div class="quiz-question" id="quiz-question-text"></div>
        <div id="quiz-choices"></div>
        <div id="quiz-result-panel" class="quiz-result-panel"></div>
        <div class="quiz-action-row" id="quiz-action-row" style="display:none">
          <button class="view-theory-btn" id="view-theory-btn" style="display:none">📖 이론 보기</button>
          <button class="quiz-next-btn" id="quiz-next-btn">다음 문제 →</button>
        </div>
      </div>
    </div>

    <!-- 결과 화면 -->
    <div id="quiz-finish" class="quiz-finish">
      <div class="finish-card">
        <div class="finish-score" id="finish-score">0/0</div>
        <div class="finish-label" id="finish-pct">정답률 0%</div>
        <div class="finish-msg" id="finish-msg"></div>
        <div class="finish-actions">
          <button class="finish-btn primary" onclick="retryQuiz()">🔄 다시 풀기</button>
          <button class="finish-btn secondary" onclick="goTo('wrong');renderWrongNote()">❌ 오답 확인</button>
          <button class="finish-btn secondary" onclick="goTo('quiz');renderQuizSetup()">← 문제 선택</button>
        </div>
      </div>
    </div>

  </div>

  <!-- ══ 오답노트 ══ -->
  <div id="page-wrong" class="page">
    <div class="section-title">
      ❌ 오답노트
      <span id="wrong-count-badge" style="background:var(--wrong-bg);color:var(--wrong);font-size:12px;padding:3px 10px;border-radius:20px;font-weight:700"></span>
    </div>
    <div id="wrong-note-list"></div>
  </div>

</main>
</div>
</div>

<div id="toast" class="toast"></div>

<script src="data/theories.js"></script>
<script src="data/questions.js"></script>
<script src="app.js"></script>
</body>
</html>
